<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HCMUE-FIT StudyVault</title>
    <meta name="description" content="Kho Lưu Trữ Tài Liệu Học Tập CNTT - HCMUE với công cụ xếp thời khóa biểu và trợ lý phân tích thuật toán." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" crossorigin="anonymous">
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('hcmue_theme') || localStorage.getItem('theme');
          if (saved === 'light') {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
          } else {
            document.documentElement.classList.remove('light');
            document.documentElement.classList.add('dark');
          }
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
    <meta property="og:title" content="HCMUE-FIT StudyVault" />
    <meta property="og:description" content="Kho Lưu Trữ Tài Liệu Học Tập CNTT - HCMUE với công cụ xếp thời khóa biểu và trợ lý phân tích thuật toán." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
